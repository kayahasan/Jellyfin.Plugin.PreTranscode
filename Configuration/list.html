<script>
(function(){
var pid="b3a1c9e4-6f2d-4a8b-9c3e-2d1f5a7b8c90";
var sel=new Set();
var jobInterval=null;
var rawItems=null; // Store raw API data for filtering



// Job progress polling
function pollJobs(){
ApiClient.ajax({type:'GET',url:ApiClient.getUrl('Plugins/PreTranscode/Jobs')})
.then(function(r){return r.json();})
.then(function(jobs){renderJobs(jobs);});
}

function renderJobs(jobs){
var p=document.getElementById('JobPanel');
var empty=document.getElementById('JobEmpty');
var summary=document.getElementById('JobSummary');

if(!jobs||!jobs.length){
p.style.display='none';
summary.style.display='none';
empty.style.display='';
return;
}
empty.style.display='none';
p.style.display='';

// Calculate summary
var total=jobs.length;
var completed=jobs.filter(function(j){return j.Status==='Completed';}).length;
var running=jobs.filter(function(j){return j.Status==='Running';}).length;
var queued=jobs.filter(function(j){return j.Status==='Queued';}).length;
var failed=jobs.filter(function(j){return j.Status==='Failed';}).length;
var totalSrc=0,totalOut=0;
jobs.forEach(function(j){
if(j.Status==='Completed'||j.Status==='Running'){
totalSrc+=j.SourceSizeMb||0;
totalOut+=j.OutputSizeMb||0;
}
});
var savedPct=totalSrc>0?Math.round((1-totalOut/totalSrc)*100):0;

// Update summary
summary.style.display='';
document.getElementById('SummaryTotal').textContent='&#128196; Toplam: '+total+' ('+running+' aktif, '+queued+' kuyrukta, '+completed+' tamamlandi'+(failed>0?', '+failed+' hata':'')+')';
document.getElementById('SummaryCompleted').textContent='&#10004; Tamamlandi: '+completed;
document.getElementById('SummaryRunning').textContent='&#9654; Aktif: '+running;
document.getElementById('SummarySaved').textContent=totalOut>0?'&#128188; Tasarruf: '+fsize(totalSrc)+' &#8594; '+fsize(totalOut)+' ('+savedPct+'%)':'';

var html='<div style="background:rgba(255,255,255,.03);border:1px solid #333;border-radius:8px;padding:.75em;">';
html+='<div style="font-size:.85em;font-weight:600;color:#aaa;margin-bottom:.5em;">&#9881; Islem Durumu</div>';
jobs.forEach(function(j){
var statusIcon,statusColor,statusText;
if(j.Status==='Running'){statusIcon='&#9654;';statusColor='#30d158';statusText='Kodlaniyor...';}
else if(j.Status==='Queued'){statusIcon='&#9203;';statusColor='#f5c542';statusText='Kuyrukta';}
else if(j.Status==='Completed'){statusIcon='&#10004;';statusColor='#30d158';statusText='Tamamlandi';}
else if(j.Status==='Cancelled'){statusIcon='&#9209;';statusColor='#f5c542';statusText=j.Error||'Iptal Edildi';}
else{statusIcon='&#10006;';statusColor='#ff6b6b';statusText=j.Error||'Hata';}

var pct=Math.round(j.ProgressPercent||0);
var outMb=j.OutputSizeMb||0;
var srcMb=j.SourceSizeMb||0;
var sizeStr=outMb>0?(outMb>=1024?(outMb/1024).toFixed(2)+'GB':Math.round(outMb)+'MB'):'0MB';
var srcStr=srcMb>0?(srcMb>=1024?(srcMb/1024).toFixed(2)+'GB':Math.round(srcMb)+'MB'):'?';

// Cancel button
var cancelBtn='';
if(j.Status==='Running'){
cancelBtn='<button data-cancel-id="'+j.ItemId+'" class="pt-cancel-btn" style="background:rgba(255,107,107,.2);border:1px solid #ff6b6b;color:#ff6b6b;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:.75em;margin-left:.5em;">Iptal</button>';
}

html+='<div style="display:flex;align-items:center;gap:.5em;padding:.5em 0;border-bottom:1px solid rgba(255,255,255,.04);">';
html+='<span style="color:'+statusColor+';font-size:1.1em;width:20px;text-align:center;">'+statusIcon+'</span>';
html+='<div style="flex:1;">';
html+='<div style="display:flex;justify-content:space-between;align-items:center;">';
html+='<span style="font-size:.85em;color:#eee;">'+esc(j.Name)+'</span>';
html+='<span style="font-size:.8em;color:#ccc;font-weight:600;">'+pct+'%</span>'+cancelBtn;
html+='</div>';
// Progress bar
html+='<div style="height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:.35em;overflow:hidden;">';
html+='<div style="height:100%;width:'+pct+'%;background:'+statusColor+';border-radius:3px;transition:width .5s ease;"></div>';
html+='</div>';
// Encoder badge + codec info
var encoderBadge='';
if(j.EncoderType){
var isGpu=j.EncoderType.includes('(GPU)');
var badgeBg=isGpu?'rgba(48,209,88,.15)':'rgba(136,136,136,.2)';
var badgeBorder=isGpu?'#30d158':'#666';
var badgeColor=isGpu?'#30d158':'#999';
encoderBadge='<span style="background:'+badgeBg+';border:1px solid '+badgeBorder+';color:'+badgeColor+';padding:1px 5px;border-radius:3px;font-size:.68em;margin-right:.3em;">'+esc(j.EncoderType)+'</span>';
}
var codecInfo='';
if(j.CodecConversion){
codecInfo='<span style="color:#999;">'+esc(j.CodecConversion)+'</span>';
}

html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:.2em;font-size:.72em;color:#888;">';
html+='<span>'+sizeStr+' / '+srcStr+'</span>';
html+='<span>'+statusText+'</span>';
html+='</div>';
if(encoderBadge||codecInfo){
html+='<div style="display:flex;gap:.5em;margin-top:.25em;align-items:center;">';
html+=encoderBadge;
html+=codecInfo;
html+='</div>';
}
html+='</div>';
html+='</div>';
});
html+='</div>';
p.innerHTML=html;

// Keep polling if there are running/queued jobs
var hasActive=jobs.some(function(j){return j.Status==='Running'||j.Status==='Queued';});
if(!hasActive&&jobInterval){clearInterval(jobInterval);jobInterval=null;}

// Helper: format size
function fsize(mb){
if(mb>=1024) return (mb/1024).toFixed(1)+'GB';
return Math.round(mb)+'MB';
}
// Bind cancel buttons
p.querySelectorAll('.pt-cancel-btn').forEach(function(btn){
btn.onclick=function(){
var jobId=this.getAttribute('data-cancel-id');
if(!confirm('Bu islemi iptal etmek istediğinize emin misiniz?')) return;
ApiClient.ajax({type:'POST',url:ApiClient.getUrl('Plugins/PreTranscode/Cancel/'+jobId)});
};
});
}

// Tabs
function showTab(t){
var lb=document.getElementById('TabLibrary');
var jb=document.getElementById('TabJobs');
var sb=document.getElementById('TabSettings');
var pl=document.getElementById('PanelLibrary');
var pj=document.getElementById('PanelJobs');
var ps=document.getElementById('PanelSettings');
pl.style.display='none';pj.style.display='none';ps.style.display='none';
lb.style.color='#888';lb.style.fontWeight='400';lb.style.borderBottomColor='transparent';
jb.style.color='#888';jb.style.fontWeight='400';jb.style.borderBottomColor='transparent';
sb.style.color='#888';sb.style.fontWeight='400';sb.style.borderBottomColor='transparent';
if(t==='l'){
pl.style.display='';
lb.style.color='#e50914';lb.style.fontWeight='700';lb.style.borderBottomColor='#e50914';
}else if(t==='j'){
pj.style.display='';
jb.style.color='#e50914';jb.style.fontWeight='700';jb.style.borderBottomColor='#e50914';
}else{
ps.style.display='';
sb.style.color='#e50914';sb.style.fontWeight='700';sb.style.borderBottomColor='#e50914';
loadCfg();
}
}
document.getElementById('TabLibrary').onclick=function(){showTab('l');};
document.getElementById('TabJobs').onclick=function(){showTab('j');};
document.getElementById('TabSettings').onclick=function(){showTab('s');};

// Filter/Sort event listeners
document.getElementById('FilterCodec').onchange=function(){applyFiltersAndRender();};
document.getElementById('FilterRes').onchange=function(){applyFiltersAndRender();};
document.getElementById('FilterSize').onchange=function(){applyFiltersAndRender();};
document.getElementById('SortBy').onchange=function(){applyFiltersAndRender();};

function esc(s){var d=document.createElement('span');d.textContent=s;return d.innerHTML;}
function purl(id){return ApiClient.getUrl('Items/'+id+'/Images/Primary');}
function fsize(mb){return mb>=1024?(mb/1024).toFixed(1)+' GB':Math.round(mb)+' MB';}
function ucnt(){document.getElementById('SelectedCount').textContent=sel.size>0?sel.size+' secili':'';}
function tog(id,el){
if(sel.has(id)){sel.delete(id);el.classList.remove('pt-sel');}
else{sel.add(id);el.classList.add('pt-sel');}
ucnt();
}

// Movie card - uses Jellyfin card component
function mkMovie(item){
var card=document.createElement('div');
card.style.cssText='display:inline-block;width:140px;margin:.35em;vertical-align:top;cursor:pointer;position:relative;';
card.setAttribute('data-id',item.Id);

// Card wrapper like Jellyfin
var cw=document.createElement('div');
cw.className='card scalableCard';
cw.style.cssText='width:140px;';

// Overlay checkbox
var ov=document.createElement('div');
ov.className='cardBox visualCardBox';
ov.style.cssText='position:relative;';

// Image container
var ic=document.createElement('div');
ic.className='cardScalableImageAspect';
ic.style.cssText='aspect-ratio:2/3;';

var img=document.createElement('img');
img.className='cardPadder cardPadder-home scalableImageOnTop';
img.style.cssText='width:100%;height:100%;object-fit:cover;display:block;';
if(item.PosterUrl){
img.src=purl(item.PosterUrl);
img.onerror=function(){this.style.display='none';};
}else{img.style.display='none';}
ic.appendChild(img);
ov.appendChild(ic);

// Footer
var ft=document.createElement('div');
ft.className='cardFooter';
ft.style.cssText='padding:.4em;';
var tn=document.createElement('div');
tn.className='cardText';
tn.style.cssText='font-size:.95em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
tn.textContent=item.Name;
ft.appendChild(tn);
var mt=document.createElement('div');
mt.style.cssText='font-size:.9em;color:#ccc;margin-top:.15em;';
var metaParts=[fsize(item.SizeMb)];
if(item.Resolution) metaParts.push(item.Resolution);
metaParts.push(item.Codec.toUpperCase());
mt.textContent=metaParts.join(' | ');
ft.appendChild(mt);
ov.appendChild(ft);

cw.appendChild(ov);
card.appendChild(cw);

// Selection overlay
var ch=document.createElement('div');
ch.className='cardOverlayButton cardOverlayBottomBrand';
ch.style.cssText='position:absolute;top:.3em;right:.3em;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px;z-index:5;transition:all .15s;';
ch.textContent='\u2713';
cw.querySelector('.cardBox').appendChild(ch);

card.onclick=function(){
tog(item.Id,card);
if(sel.has(item.Id)){
ch.style.background='#e50914';ch.style.borderColor='#e50914';ch.style.color='#fff';
}else{
ch.style.background='rgba(0,0,0,.6)';ch.style.borderColor='rgba(255,255,255,.3)';ch.style.color='transparent';
}
};

return card;
}

// Series accordion
function mkSeries(si){
var wrap=document.createElement('div');
wrap.style.cssText='margin-bottom:1em;border:1px solid #333;border-radius:8px;overflow:hidden;';

var hdr=document.createElement('div');
hdr.style.cssText='display:flex;align-items:center;gap:.75em;padding:.75em;cursor:pointer;background:rgba(255,255,255,.03);';

var sp=document.createElement('img');
sp.style.cssText='width:40px;height:60px;object-fit:cover;border-radius:4px;flex-shrink:0;';
if(si.PosterUrl){sp.src=purl(si.PosterUrl);sp.onerror=function(){this.style.display='none';};}
else{sp.style.display='none';}
hdr.appendChild(sp);

var st=document.createElement('div');
st.style.cssText='flex:1;';
st.innerHTML='<div style="font-weight:600;font-size:.92em;">'+esc(si.Name)+'</div>';
var epc=0;(si.Seasons||[]).forEach(function(s){epc+=s.Episodes.length;});
st.innerHTML+='<div style="font-size:.78em;color:#888;">'+epc+' bolum</div>';
hdr.appendChild(st);

var arr=document.createElement('span');
arr.style.cssText='color:#666;font-size:1.2em;transition:transform .2s;';
arr.textContent='\u25b6';
hdr.appendChild(arr);

var body=document.createElement('div');
body.style.display='none';

// Select all
var sa=document.createElement('div');
sa.style.cssText='padding:.4em .75em;border-bottom:1px solid #222;display:flex;align-items:center;gap:.4em;font-size:.82em;color:#999;';
sa.innerHTML='<input type="checkbox" class="pt-sa" /> Tum bolimleri sec';
body.appendChild(sa);

(si.Seasons||[]).forEach(function(season){
var sd=document.createElement('div');
sd.style.cssText='padding:.5em .75em .5em 2em;border-bottom:1px solid rgba(255,255,255,.04);';
var st2=document.createElement('div');
st2.style.cssText='font-size:.82em;font-weight:600;color:#aaa;margin-bottom:.35em;';
st2.textContent='Sezon '+season.SeasonNumber+' ('+season.Episodes.length+')';
sd.appendChild(st2);

season.Episodes.forEach(function(ep){
var r=document.createElement('div');
r.style.cssText='display:flex;align-items:center;gap:.5em;padding:.4em .4em;border-radius:4px;cursor:pointer;font-size:.9em;transition:background .1s;';
r.setAttribute('data-id',ep.Id);
r.onmouseover=function(){r.style.background='rgba(255,255,255,.04)';};
r.onmouseout=function(){if(!sel.has(ep.Id))r.style.background='';};

var ck=document.createElement('div');
ck.style.cssText='width:18px;height:18px;border-radius:3px;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:transparent;font-size:10px;flex-shrink:0;transition:all .15s;';
ck.textContent='\u2713';
r.appendChild(ck);

var nm=document.createElement('div');
nm.style.cssText='flex:1;color:#eee;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
nm.textContent=ep.Name;
r.appendChild(nm);

function render(data){
try{
var c=document.getElementById('LibraryContent');
c.innerHTML='';
if(!data){throw new Error('Boş yanit alindi');}
var mv=data.Movies||[];
var sr=data.Series||[];
if(!Array.isArray(mv)) mv=[];
if(!Array.isArray(sr)) sr=[];
var te=0;sr.forEach(function(s){(s.Seasons||[]).forEach(function(sn){te+=sn.Episodes.length;});});

if(!mv.length&&!te){
c.innerHTML='<div style="text-align:center;padding:3em;color:#666;"><div style="font-size:2.5em;color:#30d158;margin-bottom:.5em;">\u2714</div><h3 style="color:#999;">Tebrikler!</h3><p style="color:#666;">Uyumsuz dosya yok.</p></div>';
return;
}

if(mv.length){
var st=document.createElement('div');
st.style.cssText='font-size:.9em;font-weight:600;color:#aaa;margin-bottom:.75em;display:flex;align-items:center;gap:.5em;';
st.innerHTML='Filmler <span style="font-size:.85em;padding:.1em .4em;border-radius:8px;background:rgba(255,255,255,.08);color:#999;font-weight:400;">'+mv.length+'</span>';
c.appendChild(st);

var grid=document.createElement('div');
grid.style.cssText='display:flex;flex-wrap:wrap;';
mv.forEach(function(item){grid.appendChild(mkMovie(item));});
c.appendChild(grid);
}

if(sr.length){
var st2=document.createElement('div');
st2.style.cssText='font-size:.9em;font-weight:600;color:#aaa;margin:1.5em 0 .75em;display:flex;align-items:center;gap:.5em;';
st2.innerHTML='Diziler <span style="font-size:.85em;padding:.1em .4em;border-radius:8px;background:rgba(255,255,255,.08);color:#999;font-weight:400;">'+sr.length+' dizi, '+te+' bolum</span>';

}catch(e){

// Filter + Sort
function applyFiltersAndRender(){
if(!rawItems) return;
var codec=document.getElementById('FilterCodec').value.toLowerCase();
var res=document.getElementById('FilterRes').value;
var minSize=parseInt(document.getElementById('FilterSize').value)||0;
var sortBy=document.getElementById('SortBy').value;

var movies=(rawItems.Movies||[]).filter(function(m){
if(codec && !m.Codec.toLowerCase().includes(codec)) return false;
if(res && m.Resolution !== res) return false;
if(minSize && m.SizeMb < minSize) return false;
return true;
});

var series=(rawItems.Series||[]).map(function(s){
return {
Id: s.Id,
Name: s.Name,
PosterUrl: s.PosterUrl,
Seasons: (s.Seasons||[]).map(function(sn){
return {
SeasonNumber: sn.SeasonNumber,
Episodes: (sn.Episodes||[]).filter(function(e){
if(codec && !e.Codec.toLowerCase().includes(codec)) return false;
if(res && e.Resolution !== res) return false;
if(minSize && e.SizeMb < minSize) return false;
return true;
})
};
}).filter(function(sn){return sn.Episodes.length>0;})
};
}).filter(function(s){return s.Seasons.length>0;});

// Sort movies
if(sortBy==='size-desc') movies.sort(function(a,b){return b.SizeMb-a.SizeMb;});
else if(sortBy==='size-asc') movies.sort(function(a,b){return a.SizeMb-b.SizeMb;});
else if(sortBy==='name-asc') movies.sort(function(a,b){return a.Name.localeCompare(b.Name);});

// Sort series by name
if(sortBy==='name-asc') series.sort(function(a,b){return a.Name.localeCompare(b.Name);});

// Update filter count
var totalMovies=movies.length;
var totalEpisodes=0;
series.forEach(function(s){s.Seasons.forEach(function(sn){totalEpisodes+=sn.Episodes.length;});});
var total=totalMovies+totalEpisodes;
var originalMovies=(rawItems.Movies||[]).length;
var originalEpisodes=0;
(rawItems.Series||[]).forEach(function(s){s.Seasons.forEach(function(sn){originalEpisodes+=sn.Episodes.length;});});
var originalTotal=originalMovies+originalEpisodes;
var fc=document.getElementById('FilterCount');
if(total<originalTotal){
fc.textContent=total+'/'+originalTotal+' gosteriliyor';
}else{
fc.textContent='';
}

render({Movies:movies,Series:series});
}

function showEncodePreview(ids){
Dashboard.showLoadingMsg();
ApiClient.ajax({type:'POST',url:ApiClient.getUrl('Plugins/PreTranscode/EncodePreview'),data:JSON.stringify({ItemIds:ids}),contentType:'application/json'})
.then(function(r){
Dashboard.hideLoadingMsg();
var totalSizeMb=r.TotalSizeMb||0;
var totalSizeGb=(totalSizeMb/1024).toFixed(1);
var estSavedGb=(totalSizeGb*0.4).toFixed(1); // Yaklasik %40 tasarruf
var html='<div style="padding:1em;">';
html+='<h3 style="margin-top:0;color:#e50914;">&#128230; Kodlama Onizlemesi</h3>';
html+='<p style="color:#ccc;">Toplam: <b>'+r.TotalItems+'</b> dosya (<b>'+totalSizeGb+' GB</b>)</p>';
html+='<p style="color:#30d158;">Kodlanacak: <b>'+r.ToEncode+'</b> dosya</p>';
if(r.AlreadyTargetCodec>0){
html+='<p style="color:#ffa500;">Atlanacak: <b>'+r.AlreadyTargetCodec+'</b> dosya (zaten hedef codec\'te)</p>';
if(r.SkippedItems&&r.SkippedItems.length>0){
html+='<div style="background:#1a1a1a;padding:.5em;border-radius:4px;margin:.5em 0;font-size:.85em;color:#aaa;max-height:100px;overflow-y:auto;">';
r.SkippedItems.slice(0,5).forEach(function(s){html+='<div>• '+s+'</div>';});
if(r.SkippedItems.length>5) html+='<div style="color:#666;">...ve '+ (r.SkippedItems.length-5) +' tane daha</div>';
html+='</div>';
}
}
html+='<p style="color:#888;font-size:.85em;">Tahmini tasarruf: ~'+estSavedGb+' GB</p>';
html+='<div style="margin-top:1em;display:flex;gap:.5em;justify-content:flex-end;">';
html+='<button id="PreviewCancel" is="emby-button" class="button-flat">Iptal</button>';
html+='<button id="PreviewConfirm" is="emby-button" class="raised button-submit">Kodlamaya Basla</button>';
html+='</div></div>';

var dlg = {
    title: '',
    html: html,
    scrollY: false
};

require(['dialog'], function (Dialog) {
    var dialogInstance = new Dialog(dlg);
    dialogInstance.on('open', function() {
        $(dialogInstance.getModal()).css('maxWidth', '550px');
        $(dialogInstance.getModal()).find('#PreviewCancel').off('click').on('click', function() {
            dialogInstance.close();
        });
        $(dialogInstance.getModal()).find('#PreviewConfirm').off('click').on('click', function() {
            dialogInstance.close();
            encodeItems(ids);
        });
    });
    dialogInstance.open();
});
})
.catch(function(e){
Dashboard.hideLoadingMsg();
console.error('Preview hatasi:',e);
Dashboard.alert('Onizleme alinamadi: '+e);
});
}

function encodeItems(ids){

}
