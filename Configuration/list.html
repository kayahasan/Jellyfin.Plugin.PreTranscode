(function(){

ApiClient.ajax({type:'GET',url:ApiClient.getUrl('Plugins/PreTranscode/Jobs')})

function fsize(mb){return mb>=1024?(mb/1024).toFixed(1)+' GB':Math.round(mb)+' MB';}
function esc(s){var d=document.createElement('span');d.textContent=s;return d.innerHTML;}
function purl(id){return ApiClient.getUrl('Items/'+id+'/Images/Primary');}

function renderJobs(jobs){
var p=document.getElementById('JobPanel');
if(!jobs||!jobs.length){p.innerHTML='';return;}
var html='<div class="pt-job-card">';
html+='<div class="pt-job-header">&#9881; Aktif &#73;&#351;lemler</div>';
jobs.forEach(function(j){
var statusIcon,statusColor,statusText;
if(j.Status==='Running'){statusIcon='&#9654;';statusColor='#30d158';statusText='Kodlaniyor...';}
else if(j.Status==='Queued'){statusIcon='&#9203;';statusColor='#f5c542';statusText='Kuyrukta';}
else if(j.Status==='Completed'){statusIcon='&#10004;';statusColor='#30d158';statusText='Tamamlandi';}
else if(j.Status==='Cancelled'){statusIcon='&#9209;';statusColor='#f5c542';statusText=j.Error||'Iptal Edildi';}
else{statusIcon='&#10006;';statusColor='#ff6b6b';statusText=j.Error||'Hata';}
var pct=Math.round(j.ProgressPercent||0);
var outMb=j.OutputSizeMb||0;var srcMb=j.SourceSizeMb||0;
var sizeStr=outMb>0?fsize(outMb):'0MB';var srcStr=srcMb>0?fsize(srcMb):'?';
var cancelBtn='';
if(j.Status==='Running'){
cancelBtn='<button data-cancel-id="'+j.ItemId+'" class="pt-cancel-btn">Iptal</button>';
}
var encoderBadge='';
if(j.EncoderType){
var isGpu=j.EncoderType.includes('vaapi')||j.EncoderType.includes('qsv')||j.EncoderType.includes('nvenc')||j.EncoderType.includes('amf');
encoderBadge='<span class="pt-badge '+(isGpu?'pt-badge-gpu':'pt-badge-cpu')+'">'+esc(j.EncoderType)+(isGpu?' (GPU)':' (CPU)')+'</span>';
}
var codecInfo='';
if(j.CodecConversion){codecInfo='<span class="pt-badge pt-badge-codec">'+esc(j.CodecConversion)+'</span>';}
var speedEta='';
if(j.EncodeSpeedFps>0){speedEta=Math.round(j.EncodeSpeedFps)+'fps';}
if(j.EtaText){speedEta+=(speedEta?' | ':'')+j.EtaText;}

};

var hasActive=jobs.some(function(j){return j.Status==='Running'||j.Status==='Queued';});
if(!hasActive&&jobInterval){clearInterval(jobInterval);jobInterval=null;}

var html='<div class="pt-job-header">&#9998; Tüm &#73;&#351;lemler</div>';

if(j.Status==='Running'){statusIcon='&#9654;';statusColor='#30d158';statusText='Kodlaniyor...';}
else if(j.Status==='Queued'){statusIcon='&#9203;';statusColor='#f5c542';statusText='Kuyrukta';}

else{statusIcon='&#10006;';statusColor='#ff6b6b';statusText=j.Error||'Hata';}
var pct=Math.round(j.ProgressPercent||0);
var outMb=j.OutputSizeMb||0;var srcMb=j.SourceSizeMb||0;
var sizeStr=outMb>0?fsize(outMb):'0MB';var srcStr=srcMb>0?fsize(srcMb):'?';
var cancelBtn='';
if(j.Status==='Running'){
cancelBtn='<button data-cancel-id="'+j.ItemId+'" class="pt-cancel-btn">Iptal</button>';
}
var encoderBadge='';
if(j.EncoderType){
var isGpu=j.EncoderType.includes('vaapi')||j.EncoderType.includes('qsv')||j.EncoderType.includes('nvenc')||j.EncoderType.includes('amf');
encoderBadge='<span class="pt-badge '+(isGpu?'pt-badge-gpu':'pt-badge-cpu')+'">'+esc(j.EncoderType)+(isGpu?' (GPU)':' (CPU)')+'</span>';
}
var codecInfo='';
if(j.CodecConversion){codecInfo='<span class="pt-badge pt-badge-codec">'+esc(j.CodecConversion)+'</span>';}
var speedEta='';
if(j.EncodeSpeedFps>0){speedEta=Math.round(j.EncodeSpeedFps)+'fps';}
if(j.EtaText){speedEta+=(speedEta?' | ':'')+j.EtaText;}
html+='<div class="pt-job-row">';
html+='<span class="pt-status-icon" style="color:'+statusColor+'">'+statusIcon+'</span>';
html+='<div class="pt-job-info">';
html+='<div class="pt-job-title-row">';
html+='<span class="pt-job-name">'+esc(j.Name)+'</span>';
html+='<span class="pt-job-pct">'+pct+'%</span>'+cancelBtn;
html+='</div>';

html+='<div class="pt-job-meta">';
html+='<span>'+sizeStr+' / '+srcStr+'</span>';
html+='<span>'+codecInfo+encoderBadge+'</span>';
html+='<span>'+speedEta+' '+statusText+'</span>';
html+='</div>';
html+='</div></div>';
});
list.innerHTML=html;

else{sel.add(id);el.classList.add('pt-sel');}
ucnt();

function mkMovie(item){
var card=document.createElement('div');
card.className='pt-movie-card';
card.setAttribute('data-id',item.Id);
var box=document.createElement('div');box.className='pt-card-box';
var img=document.createElement('img');img.className='pt-card-img';
if(item.PosterUrl){img.src=purl(item.PosterUrl);img.onerror=function(){this.style.display='none';};}
else{img.style.display='none';}
box.appendChild(img);
var ft=document.createElement('div');ft.className='pt-card-footer';
var tn=document.createElement('div');tn.className='pt-card-title';tn.textContent=item.Name;
ft.appendChild(tn);
var mt=document.createElement('div');mt.className='pt-card-meta';
mt.textContent=fsize(item.SizeMb)+' | '+item.Codec.toUpperCase();
ft.appendChild(mt);
box.appendChild(ft);
card.appendChild(box);
var ch=document.createElement('div');ch.className='pt-check';ch.textContent='\u2713';
box.appendChild(ch);
card.onclick=function(){
tog(item.Id,card);
if(sel.has(item.Id))ch.classList.add('selected');
else ch.classList.remove('selected');
};
return card;
}

else{sp.style.display='none';}
hdr.appendChild(sp);
var st=document.createElement('div');st.style.flex='1';
st.innerHTML='<div style="font-weight:600;font-size:.92em;">'+esc(si.Name)+'</div>';
var epc=0;(si.Seasons||[]).forEach(function(s){epc+=s.Episodes.length;});
st.innerHTML+='<div style="font-size:.78em;color:#888;">'+epc+' bolum</div>';
hdr.appendChild(st);
var arr=document.createElement('span');arr.style.color='#666';arr.textContent='\u25b6';
hdr.appendChild(arr);
var body=document.createElement('div');body.style.display='none';body.className='pt-series-body';
var sa=document.createElement('div');
sa.style.cssText='padding:.4em .75em;border-bottom:1px solid #222;display:flex;align-items:center;gap:.4em;font-size:.82em;color:#999;';
sa.innerHTML='<input type="checkbox" class="pt-sa" /> Tum bolimleri sec';
body.appendChild(sa);
(si.Seasons||[]).forEach(function(season){
var sd=document.createElement('div');sd.className='pt-season';
var st2=document.createElement('div');st2.className='pt-season-title';
st2.textContent='Sezon '+season.SeasonNumber+' ('+season.Episodes.length+')';
sd.appendChild(st2);
season.Episodes.forEach(function(ep){
var r=document.createElement('div');r.className='pt-ep-row';r.setAttribute('data-id',ep.Id);
var ck=document.createElement('div');ck.className='pt-ep-check';ck.textContent='\u2713';
r.appendChild(ck);
var nm=document.createElement('div');nm.className='pt-ep-name';nm.textContent=ep.Name;
r.appendChild(nm);
var me=document.createElement('div');me.className='pt-ep-meta';
me.innerHTML=fsize(ep.SizeMb)+' <span class="pt-badge pt-badge-codec">'+esc(ep.Codec)+'</span>';
r.appendChild(me);
r.onclick=function(){
tog(ep.Id,r);
if(sel.has(ep.Id))ck.classList.add('selected');
else ck.classList.remove('selected');
};
sd.appendChild(r);
});
body.appendChild(sd);
});
wrap.appendChild(hdr);wrap.appendChild(body);
hdr.onclick=function(){
if(body.style.display==='none'){body.style.display='';arr.textContent='\u25bc';}
else{body.style.display='none';arr.textContent='\u25b6';}
};
sa.querySelector('.pt-sa').addEventListener('change',function(){
var c=this.checked;
body.querySelectorAll('[data-id]').forEach(function(r){
var id=r.getAttribute('data-id');var ck=r.querySelector('.pt-ep-check');
if(c){sel.add(id);ck.classList.add('selected');r.classList.add('pt-sel');}
else{sel.delete(id);ck.classList.remove('selected');r.classList.remove('pt-sel');}
});ucnt();
});
return wrap;
}

function render(data){
try{
var c=document.getElementById('LibraryContent');c.innerHTML='';
if(!data){throw new Error('Boş yanit alindi');}
var mv=data.Movies||[];var sr=data.Series||[];
if(!Array.isArray(mv))mv=[];if(!Array.isArray(sr))sr=[];
var te=0;sr.forEach(function(s){(s.Seasons||[]).forEach(function(sn){te+=sn.Episodes.length;});});
if(!mv.length&&!te){
c.innerHTML='<div class="pt-empty"><div class="pt-empty-icon">&#10004;</div><h3>Tebrikler!</h3><p style="color:#666;">Uyumsuz dosya yok.</p></div>';
return;
}
if(mv.length){
var st=document.createElement('div');st.className='pt-section-title';
st.innerHTML='Filmler <span class="pt-section-count">'+mv.length+'</span>';
c.appendChild(st);
var grid=document.createElement('div');grid.style.cssText='display:flex;flex-wrap:wrap;';
mv.forEach(function(item){grid.appendChild(mkMovie(item));});
c.appendChild(grid);
}
if(sr.length){
var st2=document.createElement('div');st2.className='pt-section-title';
st2.innerHTML='Diziler <span class="pt-section-count">'+sr.length+' dizi, '+te+' bolum</span>';
c.appendChild(st2);
sr.forEach(function(s){c.appendChild(mkSeries(s));});
}
}catch(e){
console.error('PreTranscode render hatasi:',e);
var c=document.getElementById('LibraryContent');
c.innerHTML='<div class="pt-error"><p>Render hatasi: '+esc(String(e))+'</p></div>';
}
}

function loadItems(){
Dashboard.showLoadingMsg();sel.clear();ucnt();
ApiClient.ajax({type:'GET',url:ApiClient.getUrl('Plugins/PreTranscode/Items')})
.then(function(r){if(!r.ok)throw new Error('API hata: '+r.status);return r.json();})
.then(function(d){render(d);Dashboard.hideLoadingMsg();})
.catch(function(e){
console.error('PreTranscode yukleme hatasi:',e);Dashboard.hideLoadingMsg();
var c=document.getElementById('LibraryContent');
c.innerHTML='<div class="pt-error"><div style="font-size:1.5em;margin-bottom:.5em;">&#9888;</div><p>Yuklenemedi: '+esc(String(e))+'</p></div>';
});
}

function loadCfg(){
ApiClient.getPluginConfiguration(pid).then(function(cfg){
var v=document.getElementById('PreTranscodeListPage');
v.querySelector('#HardwareAcceleration').value=cfg.HardwareAcceleration;
v.querySelector('#RenderDevicePath').value=cfg.RenderDevicePath||'';
v.querySelector('#TargetVideoCodec').value=cfg.TargetVideoCodec;
v.querySelector('#Quality').value=cfg.Quality||24;
v.querySelector('#MaxWidth').value=cfg.MaxWidth||0;
v.querySelector('#MinimumFileSizeMb').value=cfg.MinimumFileSizeMb||100;
v.querySelector('#MaxConcurrentJobs').value=cfg.MaxConcurrentJobs||1;
v.querySelector('#SkipIfAlreadyTargetCodec').checked=cfg.SkipIfAlreadyTargetCodec;
v.querySelector('#ReplaceOriginal').checked=cfg.ReplaceOriginal;
document.getElementById('RenderDeviceField').style.display=(cfg.HardwareAcceleration==='Vaapi'||cfg.HardwareAcceleration==='Qsv')?'':'none';
}).catch(function(e){console.error('PreTranscode: config yuklenemedi',e);});
}

document.getElementById('HardwareAcceleration').addEventListener('change',function(){
document.getElementById('RenderDeviceField').style.display=(this.value==='Vaapi'||this.value==='Qsv')?'':'none';
});

document.getElementById('PreTranscodeConfigForm').addEventListener('submit',function(e){
e.preventDefault();
var v=document.getElementById('PreTranscodeListPage');
Dashboard.showLoadingMsg();
ApiClient.getPluginConfiguration(pid).then(function(cfg){
cfg.HardwareAcceleration=v.querySelector('#HardwareAcceleration').value;
cfg.RenderDevicePath=v.querySelector('#RenderDevicePath').value;
cfg.TargetVideoCodec=v.querySelector('#TargetVideoCodec').value;
cfg.Quality=parseInt(v.querySelector('#Quality').value,10);
cfg.MaxWidth=parseInt(v.querySelector('#MaxWidth').value,10);
cfg.MinimumFileSizeMb=parseInt(v.querySelector('#MinimumFileSizeMb').value,10);
cfg.MaxConcurrentJobs=parseInt(v.querySelector('#MaxConcurrentJobs').value,10);
cfg.SkipIfAlreadyTargetCodec=v.querySelector('#SkipIfAlreadyTargetCodec').checked;
cfg.ReplaceOriginal=v.querySelector('#ReplaceOriginal').checked;
ApiClient.updatePluginConfiguration(pid,cfg).then(function(r){
Dashboard.processPluginConfigurationUpdateResult(r);
var s=v.querySelector('#PtStatus');s.textContent='Kaydedildi';s.style.color='#30d158';
setTimeout(function(){s.textContent='';s.style.color='#555';},3000);
});
});
return false;
});

document.getElementById('PreTranscodeListPage').addEventListener('pageshow',function(){
loadItems();
document.getElementById('RefreshBtn').onclick=loadItems;
document.getElementById('SelectAllBtn').onclick=function(){
document.querySelectorAll('[data-id]').forEach(function(el){
var id=el.getAttribute('data-id');if(!id)return;
sel.add(id);el.classList.add('pt-sel');
var ck=el.querySelector('.pt-check,.pt-ep-check');
if(ck)ck.classList.add('selected');
});ucnt();};
document.getElementById('DeselectAllBtn').onclick=function(){
sel.clear();
document.querySelectorAll('[data-id]').forEach(function(el){el.classList.remove('pt-sel');
var ck=el.querySelector('.pt-check,.pt-ep-check');if(ck)ck.classList.remove('selected');});
ucnt();};
document.getElementById('EncodeBtn').onclick=function(){
var ids=Array.from(sel);
if(!ids.length){Dashboard.alert('En az bir ogre sec.');return;}
ApiClient.ajax({type:'POST',url:ApiClient.getUrl('Plugins/PreTranscode/Encode'),data:JSON.stringify({ItemIds:ids}),contentType:'application/json'})
.then(function(){
Dashboard.alert(ids.length+' ogre kuyruga alindi.');
if(!jobInterval){jobInterval=setInterval(pollJobs,2000);}
pollJobs();
});
};
});
})();
</script>

</div>
